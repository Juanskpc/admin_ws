<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebChat hostil — EscalApp Intelligence</title>
<!--
  Banco de pruebas del canal (ADR-016). No es el widget de producto: es la consola desde la
  que se maltrata al motor a propósito.

  Sin build, sin dependencias y sin framework, por dos razones. Una: nada de Intelligence
  debe arrastrar una cadena de herramientas para poder mirarse. Y dos: este archivo tiene que
  poder leerse entero de una sentada para creerse lo que demuestra — que el canal NO devuelve
  la respuesta del bot en el mismo HTTP, sino que la pregunta después.
-->
<style>
  :root { color-scheme: light dark; --borde:#d4d4d8; --tenue:#71717a; --acento:#4f46e5; }
  @media (prefers-color-scheme: dark) { :root { --borde:#3f3f46; --tenue:#a1a1aa; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui,sans-serif; display:grid; grid-template-columns:1fr 320px;
         height:100dvh; }
  main { display:flex; flex-direction:column; min-width:0; }
  header { padding:12px 16px; border-bottom:1px solid var(--borde); display:flex; gap:12px;
           align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #hilo { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:min(560px,80%); padding:8px 12px; border-radius:12px; white-space:pre-wrap;
         word-break:break-word; }
  .yo { align-self:flex-end; background:var(--acento); color:#fff; }
  .bot { align-self:flex-start; border:1px solid var(--borde); }
  .sis { align-self:center; color:var(--tenue); font-size:12px; font-style:italic; }
  .opciones { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .opciones button { border:1px solid var(--acento); background:transparent; color:var(--acento);
                     border-radius:999px; padding:4px 12px; cursor:pointer; font:inherit; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--borde); }
  input, button, select { font:inherit; }
  #texto { flex:1; padding:8px 12px; border:1px solid var(--borde); border-radius:8px;
           background:transparent; color:inherit; }
  aside { border-left:1px solid var(--borde); padding:16px; overflow-y:auto; }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--tenue);
             margin:0 0 4px; }
  aside p { color:var(--tenue); font-size:12px; margin:0 0 16px; }
  .fallo { display:block; margin-bottom:14px; }
  .fallo strong { display:block; font-weight:600; }
  .fallo small { color:var(--tenue); }
  .acciones button { width:100%; padding:8px; margin-bottom:8px; border:1px solid var(--borde);
                     border-radius:8px; background:transparent; color:inherit; cursor:pointer; }
  #negocio { width:60px; padding:4px 8px; border:1px solid var(--borde); border-radius:6px;
             background:transparent; color:inherit; }
  code { font-size:11px; color:var(--tenue); }
</style>
</head>
<body>
<main>
  <header>
    <h1>WebChat hostil</h1>
    <label>negocio <input id="negocio" type="number" value="1" min="1" /></label>
    <code id="sesion"></code>
  </header>
  <div id="hilo"></div>
  <form id="envio">
    <input id="texto" placeholder="Escribe y pulsa Enter…" autocomplete="off" />
    <button type="submit">Enviar</button>
  </form>
</main>

<aside>
  <h2>Simulador de fallos</h2>
  <p>Cada interruptor caza un bug distinto del motor. Apagados por defecto.</p>

  <label class="fallo">
    <input type="checkbox" data-fallo="duplicar" />
    <strong>Duplicar entrante</strong>
    <small>Reentrega el mismo mensaje. Caza la deduplicación por <code>id_externo</code>.</small>
  </label>

  <label class="fallo">
    <input type="checkbox" data-fallo="reordenar" />
    <strong>Reordenar</strong>
    <small>Retiene uno y lo suelta detrás del siguiente. El turno debe leerse en el orden en
    que se escribió, no en el que llegó.</small>
  </label>

  <label class="fallo">
    <strong>Retrasar la entrega</strong>
    <select data-fallo="retraso_salida_ms">
      <option value="0">sin retraso</option>
      <option value="3000">3 s</option>
      <option value="10000">10 s</option>
      <option value="30000">30 s</option>
    </select>
    <small>El motor no debe asumir entrega inmediata.</small>
  </label>

  <label class="fallo">
    <strong>Fallar la entrega</strong>
    <select data-fallo="fallar_salida">
      <option value="0">nunca</option>
      <option value="2">2 intentos</option>
      <option value="5">5 → dead letter</option>
    </select>
    <small>Caza reintentos y <i>dead letter</i>.</small>
  </label>

  <h2>Acciones</h2>
  <div class="acciones">
    <button id="rafaga">Ráfaga de 5 en 2 s</button>
    <button id="limpiar">Nueva sesión</button>
  </div>
  <p>La ráfaga debe producir <b>un</b> turno y <b>una</b> respuesta. Si salen cinco, el
  debounce no está haciendo su trabajo.</p>
</aside>

<!-- El JS va en un archivo aparte a propósito: Helmet aplica script-src 'self', así que un
     script inline queda bloqueado por CSP. Ver la cabecera de widget.js. -->
<script src="widget.js"></script>
</body>
</html>
